<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e0e5ec; font-family: Arial, sans-serif; margin: 0; }
        .calculator { background: #333; padding: 20px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); width: 280px; }
        #display { width: 100%; height: 60px; background: #222; color: #00ff00; text-align: right; font-size: 28px; padding: 10px; border: none; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; font-family: monospace; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        button { padding: 15px; font-size: 20px; cursor: pointer; border: none; border-radius: 8px; background: #eee; transition: background 0.2s; font-weight: bold; }
        button:hover { background: #d4d4d4; }
        .operator { background: #f39c12; color: white; }
        .operator:hover { background: #e67e22; }
        .clear { background: #e74c3c; color: white; }
        .clear:hover { background: #c0392b; }
        .equal { background: #2ecc71; color: white; }
        .equal:hover { background: #27ae60; }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button class="clear" style="grid-column: span 3;" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">&divide;</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">&times;</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(value) {
            display.value += value;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculateResult() {
            try {
                // Evaluates the math string and updates the display
                display.value = new Function('return ' + display.value)();
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
