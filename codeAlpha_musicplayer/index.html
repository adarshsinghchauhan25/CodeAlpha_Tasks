<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Music Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="music-player">
        <!-- Album Art -->
        <div class="cover-art">
            <img id="cover" src="https://via.placeholder.com/300" alt="Album Art">
        </div>

        <!-- Track Info -->
        <div class="track-info">
            <h2 id="title">Song Title</h2>
            <p id="artist">Artist Name</p>
        </div>

        <!-- Audio Element (Hidden) -->
        <audio id="audio"></audio>

        <!-- Progress Bar -->
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" value="0" max="100">
            <span id="duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prev-btn" class="control-btn"><i class="fas fa-backward"></i></button>
            <button id="play-btn" class="control-btn play-pause"><i class="fas fa-play"></i></button>
            <button id="next-btn" class="control-btn"><i class="fas fa-forward"></i></button>
        </div>

        <!-- Volume Control -->
        <div class="volume-container">
            <i class="fas fa-volume-up"></i>
            <input type="range" id="volume-bar" value="100" max="100">
        </div>

        <!-- Playlist (Bonus Feature) -->
        <div class="playlist-container">
            <h3>Playlist</h3>
            <ul id="playlist">
                <!-- Playlist items will be generated by JavaScript -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
